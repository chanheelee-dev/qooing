[project]
name = "qooing-workspace"
version = "0.1.0"
requires-python = ">=3.14,<3.15"
dependencies = []

[dependency-groups]
dev = [
  "pytest>=8.4,<9",
  "ruff>=0.12,<1",
  "ty>=0.0.1a20,<1",
]

[tool.uv]
package = false

[tool.uv.workspace]
members = ["backend", "knowledge_producer"]

[tool.pytest.ini_options]
testpaths = ["backend/tests", "knowledge_producer/tests", "tests"]
addopts = "-q"
pythonpath = ["backend", "knowledge_producer/src"]

[tool.ruff]
target-version = "py314"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
